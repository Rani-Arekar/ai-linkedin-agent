services:
  api:
    build: .
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - .env
    environment:
      DATABASE_URL: "sqlite:////app/data/linkedin_agent.db"
      SCHEDULER_ENABLED: "false"
      LINKEDIN_PUBLISHING_ENABLED: "false"
    ports:
      - "8000:8000"
    volumes:
      - app_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live')"]
      interval: 30s
      timeout: 5s
      retries: 3

  dashboard:
    build: .
    command: ["streamlit", "run", "frontend/dashboard.py", "--server.address=0.0.0.0", "--server.port=8501"]
    env_file:
      - .env
    environment:
      DATABASE_URL: "sqlite:////app/data/linkedin_agent.db"
      SCHEDULER_ENABLED: "false"
      LINKEDIN_PUBLISHING_ENABLED: "false"
    ports:
      - "8501:8501"
    volumes:
      - app_data:/app/data
    depends_on:
      api:
        condition: service_healthy

volumes:
  app_data:
